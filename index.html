<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VBSPU Email Signature</title>
<style>
  :root {
    --navy: #17365d;
    --gold: #c69a32;
    --muted: #5c6673;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9; color: #202833;
  }
  .page { max-width: 760px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .signature {
    display: flex; align-items: center; gap: 18px;
    width: 100%; max-width: 620px;
    padding: 18px 22px; background: #fff;
    border: 1px solid #e1e6ec; border-left: 4px solid var(--gold);
    border-radius: 8px; box-shadow: 0 5px 18px rgba(20,40,70,.07);
  }
  .logo-wrap {
    width: 92px; min-width: 92px; height: 92px;
    display: grid; place-items: center;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .details { border-left: 1px solid #e5e9ef; padding-left: 18px; }
  .name { margin: 0 0 5px; color: var(--navy); font-size: 20px; font-weight: 700; }
  .role { margin: 0 0 8px; color: #384657; font-size: 13px; }
  .university { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .rule { width: 54px; height: 2px; margin: 10px 0 0; background: var(--gold); }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    border: 0; border-radius: 6px; padding: 10px 14px;
    background: var(--navy); color: #fff; font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: #e6ebf1; color: #243447; }
  button:hover { opacity: .9; }
  @media (max-width: 520px) {
    body { padding: 16px; }
    .signature { align-items: flex-start; gap: 12px; padding: 14px; }
    .logo-wrap { width: 68px; min-width: 68px; height: 68px; }
    .details { padding-left: 12px; }
    .name { font-size: 17px; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .hint, .actions { display: none; }
    .signature { box-shadow: none; }
  }
</style>
</head>

<script>
async function copySignature() {
  const el = document.getElementById('signature');
  const html = el.outerHTML;
  const text = el.innerText;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], {type: 'text/html'}),
        'text/plain': new Blob([text], {type: 'text/plain'})
      })
    ]);
    alert('Signature block copied.');
  } catch (e) {
    const range = document.createRange();
    range.selectNode(el);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    alert('Select and copy the signature block with Ctrl+C.');
  }
}
</script>
